[project]
name = "pino-kernel"
version = "0.1.0"
description = "pino's engine: board.py to a KiCad 10 project, with fast checks"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"

[project.scripts]
pino-kernel = "pino_kernel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pino", "src/pino_kernel"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kicad_cli: runs the real kicad-cli (skipped when it is missing)",
    "kicad_libs: needs KiCad's own libraries (skipped when they are missing)",
    "krt: runs the installed KiCadRoutingTools (skipped when it is not installed)",
    "network: needs the network (skipped unless PINO_TEST_NETWORK=1)",
]
